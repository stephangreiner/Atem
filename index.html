<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physiologisches Atmen</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1b2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atem">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #0f1b2b;
    --circle: #6fa8dc;
    --circle-glow: #a4c8e8;
    --text: #e8f0f8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at center, #16283f 0%, var(--bg) 70%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 0 72px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }
  button {
    background: rgba(111,168,220,0.15);
    border: 1px solid rgba(111,168,220,0.4);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: rgba(111,168,220,0.3); }
  .controls {
    margin-top: 44px;
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .info {
    margin-top: 28px;
    font-size: 0.78rem;
    color: rgba(232,240,248,0.35);
    text-align: center;
    max-width: 320px;
    padding: 0 16px;
    pointer-events: none;
  }
  /* Auf kleinen Displays (z. B. Pixel Watch) den Hinweistext ausblenden. */
  @media (max-height: 480px), (max-width: 320px) {
    .info { display: none; }
    body { padding-bottom: 24px; }
  }

  /* ---------- Zahnrad zum Öffnen der Einstellungen ----------
     Oben zentriert (12-Uhr-Punkt): auf runden Uhren wie der Pixel Watch
     erreichbar, während die Ecken vom Display abgeschnitten werden. */
  .gear-btn {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 48px;
    height: 48px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .gear-btn svg { width: 24px; height: 24px; }

  /* ---------- Minutentakt-Anzeige ---------- */
  .timer-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 340px;
    padding: 0 16px;
  }
  .timer-display {
    font-size: 3.4rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- Brainteaser (Meditations-Ansicht) ---------- */
  .brainteaser {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 340px;
    margin-bottom: 8px;
  }
  .bt-visual { min-height: 0; }
  .bt-visual svg {
    width: min(180px, 46vmin);
    height: min(180px, 46vmin);
    color: var(--circle-glow);
    filter: drop-shadow(0 0 18px rgba(111,168,220,0.35));
  }
  .bt-text {
    font-size: 1.35rem;
    line-height: 1.5;
    font-weight: 500;
    color: var(--text);
  }
  .bt-theme {
    margin-top: 16px;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(164,200,232,0.7);
  }

  .hidden { display: none !important; }

  /* Läuft der Minutentakt (dunkler Modus): fast schwarzer Bildschirm
     (OLED-schonend, wenig Ablenkung), nur eine gedimmte Minutenanzeige. */
  body.timer-running {
    height: 100vh;
    padding: 0;
    overflow: hidden;
    background: #000;
  }
  body.timer-running .gear-btn,
  body.timer-running .info { display: none !important; }
  body.timer-running .timer-display { color: rgba(232,240,248,0.35); }
  body.timer-running .timer-panel button {
    background: transparent;
    border-color: rgba(111,168,220,0.25);
    color: rgba(232,240,248,0.35);
  }

  /* Läuft der Minutentakt im Brainteaser-Modus: ruhiger dunkler Hintergrund,
     der Denkanstoß steht im Mittelpunkt, die Minutenzahl bleibt klein. */
  body.timer-running.bt-mode {
    background: radial-gradient(circle at center, #16283f 0%, var(--bg) 70%);
  }
  body.timer-running.bt-mode .timer-display {
    font-size: 1rem;
    color: rgba(232,240,248,0.4);
    margin-top: 22px;
  }
  body.timer-running.bt-mode .timer-panel button {
    color: rgba(232,240,248,0.6);
    border-color: rgba(111,168,220,0.4);
  }

  @media (max-height: 480px), (max-width: 320px) {
    body.timer-running.bt-mode .bt-text { font-size: 1.05rem; }
    body.timer-running.bt-mode .bt-theme { margin-top: 8px; }
  }

  /* ---------- Einstellungsseite ---------- */
  .settings-page {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: radial-gradient(circle at center, #16283f 0%, var(--bg) 70%);
    overflow-y: auto;
    padding: 18px 18px 40px;
  }
  .settings-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
  }
  .settings-bar h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 600;
    text-align: center;
  }
  .settings-body {
    max-width: 360px;
    margin: 0 auto;
  }
  /* „Fertig" schließt die Einstellungen: breiter Knopf unten in der Mitte
     (6-Uhr-Punkt) – auf der runden Uhr gut erreichbar, anders als eine Ecke. */
  .settings-done {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 14px;
    border-radius: 22px;
    font-size: 1rem;
  }
  .setting-row {
    display: flex;
    flex-direction: column;
    margin-bottom: 24px;
  }
  .setting-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 0.9rem;
    margin-bottom: 10px;
    color: rgba(232,240,248,0.8);
  }
  .setting-val {
    color: var(--circle-glow);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .setting-hint {
    font-size: 0.75rem;
    color: rgba(232,240,248,0.4);
    margin-top: 8px;
    line-height: 1.45;
  }

  /* Segmentierte Auswahl (Umschalt-Knöpfe) */
  .segmented {
    display: flex;
    gap: 6px;
  }
  .segmented button {
    flex: 1;
    padding: 10px 6px;
    font-size: 0.85rem;
    border-radius: 14px;
  }
  .segmented button.active {
    background: rgba(111,168,220,0.55);
    border-color: rgba(164,200,232,0.7);
    font-weight: 600;
  }

  /* Slider */
  input[type=range] {
    width: 100%;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    padding: 12px 0;
    margin: 0;
    --fill: 0%;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 12px;
    border-radius: 8px;
    background: linear-gradient(to right, var(--circle) var(--fill), rgba(111,168,220,0.25) var(--fill));
    border: 1px solid rgba(111,168,220,0.4);
  }
  input[type=range]::-moz-range-track {
    height: 12px;
    border-radius: 8px;
    background: rgba(111,168,220,0.25);
    border: 1px solid rgba(111,168,220,0.4);
  }
  input[type=range]::-moz-range-progress {
    height: 12px;
    border-radius: 8px;
    background: var(--circle);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 34px;
    height: 34px;
    margin-top: -12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--circle-glow), var(--circle));
    border: 2px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 10px rgba(111,168,220,0.7);
  }
  input[type=range]::-moz-range-thumb {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--circle-glow), var(--circle));
    border: 2px solid rgba(255,255,255,0.85);
    box-shadow: 0 0 10px rgba(111,168,220,0.7);
  }

  /* ---------- Runde Uhr (z. B. Pixel Watch): Einstellungen ins Safe-Layout ----------
     Mehr Seitenabstand, damit Inhalt nicht am runden Rand abgeschnitten wird;
     der Titel rückt nach unten, wo der Kreis breit genug ist. */
  @media (max-height: 480px), (max-width: 320px) {
    .settings-page { padding: 34px 11% 22px; }
    .settings-bar { margin-bottom: 16px; }
  }
</style>
</head>
<body>

<button class="gear-btn" id="gearBtn" aria-label="Einstellungen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
  </svg>
</button>

<div id="timerPanel" class="timer-panel">
  <div id="brainteaser" class="brainteaser hidden">
    <div class="bt-visual" id="btVisual"></div>
    <div class="bt-text" id="btText"></div>
    <div class="bt-theme" id="btTheme"></div>
  </div>

  <div class="timer-display" id="timerDisplay">0</div>

  <div class="controls">
    <button id="timerToggleBtn">Start</button>
  </div>
</div>

<div class="info" id="infoText">Vibriert bei jeder vollen Minute. Der Bildschirm bleibt an. Einstellungen über das Zahnrad oben.</div>

<!-- ---------- Einstellungsseite ---------- -->
<div id="settingsPage" class="settings-page hidden">
  <div class="settings-bar">
    <h1>Einstellungen</h1>
  </div>
  <div class="settings-body">

    <div class="setting-row">
      <div class="setting-head">
        <span>Vibrationslänge</span>
        <span class="setting-val"><span id="vibLenVal">200</span> ms</span>
      </div>
      <input type="range" id="vibLenRange" min="100" max="800" step="100" value="200">
    </div>

    <div class="setting-row">
      <div class="setting-head"><span>Vibrationsmuster</span></div>
      <div class="segmented" id="vibPatternSeg">
        <button data-val="single">Einzelimpuls</button>
        <button data-val="double">Doppelimpuls</button>
      </div>
    </div>

    <div class="setting-row">
      <div class="setting-head"><span>Bildschirm</span></div>
      <div class="segmented" id="displayModeSeg">
        <button data-val="dark">Dunkel</button>
        <button data-val="brainteaser">Brainteaser</button>
      </div>
      <div class="setting-hint">Dunkel: fast schwarzer Bildschirm mit gedimmter Minutenzahl. Brainteaser: jede Minute ein neuer Meditations-Impuls.</div>
    </div>

    <div class="setting-row hidden" id="btTypeRow">
      <div class="setting-head"><span>Brainteaser-Art</span></div>
      <div class="segmented" id="btTypeSeg">
        <button data-val="text">Texte</button>
        <button data-val="symbol">Symbole</button>
      </div>
    </div>

    <button class="settings-done" id="settingsBack">Fertig</button>

  </div>
</div>

<script>
// ---------- Wake Lock (Bildschirm anhalten, damit die Vibration zuverlässig auslöst) ----------
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    // Wake Lock nicht verfügbar oder verweigert – Takt läuft trotzdem weiter
  }
}

function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release();
    wakeLock = null;
  }
}

document.addEventListener('visibilitychange', () => {
  if (timerRunning && document.visibilityState === 'visible') {
    requestWakeLock();
  }
});

// ---------- Konfiguration ----------
// Der Takt ist fest auf eine Minute eingestellt. Einstellbar sind Vibrationslänge
// (100–800 ms in 100er-Schritten), das Vibrationsmuster und der Bildschirm-Modus.
// Die Web-Vibration-API kennt nur Dauer, keine Stärke — die Intensität wird also
// über die Länge geregelt.
const INTERVAL_SEC = 60; // fester Minutentakt
const VIB_MIN_MS = 100;
const VIB_MAX_MS = 800;
const TIMER_STORAGE_KEY = 'atem_timer_config';

const timerConfig = {
  intervalSec: INTERVAL_SEC,
  vibrateMs: 200,
  vibratePattern: 'single',   // 'single' | 'double'
  displayMode: 'dark',        // 'dark' | 'brainteaser'
  brainteaserType: 'text'     // 'text' | 'symbol'
};

try {
  const saved = JSON.parse(localStorage.getItem(TIMER_STORAGE_KEY));
  if (saved) {
    if (typeof saved.vibrateMs === 'number') {
      const clamped = Math.min(VIB_MAX_MS, Math.max(VIB_MIN_MS, saved.vibrateMs));
      timerConfig.vibrateMs = Math.round(clamped / 100) * 100; // auf 100-ms-Raster
    }
    if (saved.vibratePattern === 'single' || saved.vibratePattern === 'double') {
      timerConfig.vibratePattern = saved.vibratePattern;
    }
    if (saved.displayMode === 'dark' || saved.displayMode === 'brainteaser') {
      timerConfig.displayMode = saved.displayMode;
    }
    if (saved.brainteaserType === 'text' || saved.brainteaserType === 'symbol') {
      timerConfig.brainteaserType = saved.brainteaserType;
    }
  }
} catch (err) { /* ungültige/leere Konfiguration – Defaults verwenden */ }

function saveTimerConfig() {
  try {
    localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify(timerConfig));
  } catch (err) { /* Speicher nicht verfügbar – Einstellung gilt nur für diese Sitzung */ }
}

function buildVibration() {
  const ms = timerConfig.vibrateMs;
  // Doppelimpuls: zwei spürbare Stöße mit kurzer Pause dazwischen.
  return timerConfig.vibratePattern === 'double' ? [ms, 140, ms] : [ms];
}

// ---------- Brainteaser-Inhalte ----------
// Meditations-Themen mit passendem Text und gezeichnetem Symbol.
const BRAINTEASERS = [
  { theme: 'Atmung',          text: 'Spüre deinen Atem — wie er kommt und geht.',        symbol: 'breath' },
  { theme: 'Gegenwart',       text: 'Nur dieser Augenblick ist wirklich.',              symbol: 'present' },
  { theme: 'Vergänglichkeit', text: 'Alles verändert sich. Auch dieser Moment.',         symbol: 'leaf' },
  { theme: 'Dankbarkeit',     text: 'Wofür bist du gerade dankbar?',                     symbol: 'heart' },
  { theme: 'Sterblichkeit',   text: 'Die Zeit ist begrenzt. Nutze sie bewusst.',         symbol: 'hourglass' },
  { theme: 'Loslassen',       text: 'Was darfst du jetzt loslassen?',                     symbol: 'feather' },
  { theme: 'Fokus',           text: 'Kehre sanft zu deinem Atem zurück.',                symbol: 'target' },
  { theme: 'Verbundenheit',   text: 'Du bist Teil von etwas Größerem.',                  symbol: 'linked' },
  { theme: 'Stille',          text: 'Höre in die Stille zwischen den Gedanken.',         symbol: 'still' },
  { theme: 'Annahme',         text: 'Nimm an, was ist — ohne zu bewerten.',              symbol: 'circle' }
];

const SYMBOLS = {
  breath:    '<circle cx="50" cy="50" r="14"/><circle cx="50" cy="50" r="26" opacity="0.7"/><circle cx="50" cy="50" r="38" opacity="0.4"/>',
  present:   '<circle cx="50" cy="50" r="34"/><circle cx="50" cy="50" r="5" fill="currentColor"/>',
  leaf:      '<path d="M50 16 C30 32 30 66 50 84 C70 66 70 32 50 16 Z"/><path d="M50 24 L50 78"/>',
  heart:     '<path d="M50 78 C10 50 22 24 44 34 C48 36 50 40 50 44 C50 40 52 36 56 34 C78 24 90 50 50 78 Z"/>',
  hourglass: '<path d="M32 22 H68 L50 50 Z"/><path d="M32 78 H68 L50 50 Z"/><path d="M28 22 H72 M28 78 H72"/>',
  feather:   '<path d="M40 74 C42 48 56 30 74 24"/><path d="M40 74 C50 70 57 62 60 54 M46 62 C54 60 60 54 63 47 M52 51 C60 49 65 44 68 38"/>',
  target:    '<circle cx="50" cy="50" r="34" opacity="0.4"/><circle cx="50" cy="50" r="22" opacity="0.7"/><circle cx="50" cy="50" r="10"/><path d="M50 6 V18 M50 82 V94 M6 50 H18 M82 50 H94"/>',
  linked:    '<circle cx="38" cy="50" r="24"/><circle cx="62" cy="50" r="24"/>',
  still:     '<path d="M24 42 H76 M20 54 H80 M28 66 H72"/>',
  circle:    '<circle cx="50" cy="50" r="34"/>'
};

function symbolSVG(key) {
  const inner = SYMBOLS[key] || SYMBOLS.circle;
  return '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" '
    + 'stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
}

// ---------- Minutentakt ----------
// Vibriert bei jeder vollen Minute seit dem Start. Die Minuten werden aus der
// Uhrzeit (Date.now) berechnet, nicht aus gezählten Ticks: drosselt der Browser
// den Timer zwischendurch, stimmt der Takt beim nächsten Tick trotzdem wieder.
const timerPanel = document.getElementById('timerPanel');
const timerDisplay = document.getElementById('timerDisplay');
const timerToggleBtn = document.getElementById('timerToggleBtn');
const brainteaser = document.getElementById('brainteaser');
const btVisual = document.getElementById('btVisual');
const btText = document.getElementById('btText');
const btTheme = document.getElementById('btTheme');

let timerRunning = false;
let timerStartTime = 0;
let timerTicksFired = 0;
let timerIntervalId = null;

function renderBrainteaser(tick) {
  const type = timerConfig.brainteaserType;
  const item = BRAINTEASERS[tick % BRAINTEASERS.length];
  if (type === 'symbol') {
    btVisual.innerHTML = symbolSVG(item.symbol);
    btText.textContent = '';
    btTheme.textContent = item.theme;
  } else { // 'text'
    btVisual.innerHTML = '';
    btText.textContent = item.text;
    btTheme.textContent = item.theme;
  }
}

function timerTick() {
  const elapsed = Date.now() - timerStartTime;
  const intervalMs = timerConfig.intervalSec * 1000;
  const ticks = Math.floor(elapsed / intervalMs);
  if (ticks > timerTicksFired) {
    timerTicksFired = ticks; // verpasste Intervalle nur einmal nachholen
    if (navigator.vibrate) navigator.vibrate(buildVibration());
    if (timerConfig.displayMode === 'brainteaser') renderBrainteaser(ticks);
  }
  timerDisplay.textContent = ticks;
}

function startTimer() {
  timerRunning = true;
  timerStartTime = Date.now();
  timerTicksFired = 0;
  timerDisplay.textContent = '0';
  document.body.classList.add('timer-running');

  const bt = timerConfig.displayMode === 'brainteaser';
  document.body.classList.toggle('bt-mode', bt);
  brainteaser.classList.toggle('hidden', !bt);
  if (bt) renderBrainteaser(0);

  timerToggleBtn.textContent = 'Stopp';
  requestWakeLock();
  if (navigator.vibrate) navigator.vibrate(80); // kurzes Startsignal
  timerIntervalId = setInterval(timerTick, 250);
}

function stopTimer() {
  if (!timerRunning) return;
  timerRunning = false;
  clearInterval(timerIntervalId);
  document.body.classList.remove('timer-running', 'bt-mode');
  brainteaser.classList.add('hidden');
  releaseWakeLock();
  timerToggleBtn.textContent = 'Start';
  // Stopp setzt zugleich auf 0 zurück – ein separater Reset ist damit unnötig.
  timerDisplay.textContent = '0';
}

timerToggleBtn.addEventListener('click', () => {
  if (timerRunning) {
    stopTimer();
  } else {
    startTimer();
  }
});

// ---------- Einstellungsseite: öffnen/schließen ----------
const gearBtn = document.getElementById('gearBtn');
const settingsPage = document.getElementById('settingsPage');
const settingsBack = document.getElementById('settingsBack');

gearBtn.addEventListener('click', () => settingsPage.classList.remove('hidden'));
settingsBack.addEventListener('click', () => settingsPage.classList.add('hidden'));

// ---------- Einstellung: Vibrationslänge ----------
const vibLenRange = document.getElementById('vibLenRange');
const vibLenVal = document.getElementById('vibLenVal');

function paintRange(el) {
  const min = parseFloat(el.min), max = parseFloat(el.max), v = parseFloat(el.value);
  el.style.setProperty('--fill', ((v - min) / (max - min)) * 100 + '%');
}

vibLenRange.addEventListener('input', () => {
  timerConfig.vibrateMs = parseInt(vibLenRange.value, 10);
  vibLenVal.textContent = timerConfig.vibrateMs;
  paintRange(vibLenRange);
  // kurzes Probe-Feedback beim Einstellen, damit die Länge spürbar wird
  if (navigator.vibrate) navigator.vibrate(buildVibration());
  saveTimerConfig();
});

// ---------- Segmentierte Auswahlen ----------
function setupSegmented(id, getVal, onSelect) {
  const seg = document.getElementById(id);
  const buttons = seg.querySelectorAll('button');
  function paint() {
    buttons.forEach(b => b.classList.toggle('active', b.dataset.val === getVal()));
  }
  buttons.forEach(b => b.addEventListener('click', () => {
    onSelect(b.dataset.val);
    paint();
  }));
  paint();
  return paint;
}

setupSegmented('vibPatternSeg',
  () => timerConfig.vibratePattern,
  (val) => {
    timerConfig.vibratePattern = val;
    if (navigator.vibrate) navigator.vibrate(buildVibration()); // Muster vorführen
    saveTimerConfig();
  });

const btTypeRow = document.getElementById('btTypeRow');

function updateBrainteaserRows() {
  const isBt = timerConfig.displayMode === 'brainteaser';
  btTypeRow.classList.toggle('hidden', !isBt);
}

setupSegmented('displayModeSeg',
  () => timerConfig.displayMode,
  (val) => {
    timerConfig.displayMode = val;
    updateBrainteaserRows();
    saveTimerConfig();
  });

setupSegmented('btTypeSeg',
  () => timerConfig.brainteaserType,
  (val) => {
    timerConfig.brainteaserType = val;
    updateBrainteaserRows();
    saveTimerConfig();
  });

// ---------- Einstellungen initial anzeigen ----------
vibLenRange.value = timerConfig.vibrateMs;
vibLenVal.textContent = timerConfig.vibrateMs;
paintRange(vibLenRange);
updateBrainteaserRows();

// ---------- PWA: Service Worker registrieren (installierbar/offline) ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {
      // Registrierung fehlgeschlagen (z. B. ohne HTTPS) – App läuft trotzdem
    });
  });
}
</script>

</body>
</html>
